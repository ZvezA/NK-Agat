<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy для Telegram</title>
    <link href="https://fontsource.org/inter/400.css" rel="stylesheet">
    <link href="https://fontsource.org/inter/600.css" rel="stylesheet">
    <link href="https://fontsource.org/inter/700.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 80%, rgba(0, 136, 204, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.15) 0%, transparent 50%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #0088cc 0%, #0066aa 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 10px 35px rgba(0, 136, 204, 0.5);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .logo svg {
            width: 48px;
            height: 48px;
            fill: white;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
        }

        .proxy-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
        }

        .proxy-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(0, 136, 204, 0.4);
            box-shadow: 0 20px 40px rgba(0, 136, 204, 0.3);
        }

        .proxy-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-text {
            color: #22c55e;
            font-size: 14px;
            font-weight: 600;
        }

        .proxy-server {
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 25px;
            text-align: center;
            word-break: break-all;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .connect-btn {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #0088cc 0%, #0066aa 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .connect-btn:hover {
            background: linear-gradient(135deg, #0099ee 0%, #0077bb 100%);
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(0, 136, 204, 0.4);
        }

        .connect-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 12px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 24px;
            }

            .logo {
                width: 70px;
                height: 70px;
            }

            .logo svg {
                width: 40px;
                height: 40px;
            }

            .proxy-card {
                padding: 24px;
            }

            .connect-btn {
                padding: 14px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
            </div>
            <h1>Proxy для Telegram</h1>
            <p class="subtitle">MTProto сервер для безопасного подключения</p>
        </div>

        <div class="proxy-card">
            <div class="proxy-status">
                <div class="status-dot"></div>
                <span class="status-text">Сервер активен</span>
            </div>

            <p class="proxy-server">138.124.52.12:443</p>

            <a href="tg://proxy?server=138.124.52.12&port=443&secret=eeba999c3d340f11bc5cbb6ed5d958aee974672e6e6b2d616761742e7275" class="connect-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                Подключиться к Telegram
            </a>
        </div>

        <div class="footer">
            <p>Быстрое и безопасное подключение</p>
        </div>
    </div>
</body>
</html>
