<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy для Telegram</title>
    <link href="https://fontsource.org/inter/400.css" rel="stylesheet">
    <link href="https://fontsource.org/inter/600.css" rel="stylesheet">
    <link href="https://fontsource.org/inter/700.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 80%, rgba(0, 136, 204, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.15) 0%, transparent 50%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #0088cc 0%, #0066aa 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 10px 30px rgba(0, 136, 204, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .logo svg {
            width: 42px;
            height: 42px;
            fill: white;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
        }

        .proxy-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .proxy-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
        }

        .proxy-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(0, 136, 204, 0.4);
            box-shadow: 0 12px 30px rgba(0, 136, 204, 0.25);
        }

        .proxy-card.socks {
            border-left: 4px solid #06b6d4;
        }

        .proxy-card.mtproto {
            border-left: 4px solid #8b5cf6;
        }

        .proxy-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .proxy-type {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .type-badge {
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .type-badge.socks {
            background: rgba(6, 182, 212, 0.2);
            color: #06b6d4;
        }

        .type-badge.mtproto {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .proxy-server {
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 14px;
            word-break: break-all;
        }

        .connect-btn {
            width: 100%;
            padding: 13px 18px;
            background: linear-gradient(135deg, #0088cc 0%, #0066aa 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .connect-btn:hover {
            background: linear-gradient(135deg, #0099ee 0%, #0077bb 100%);
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.35);
        }

        .connect-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 12px;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #22c55e;
            color: #000;
            padding: 11px 22px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 22px;
            }

            .logo {
                width: 65px;
                height: 65px;
            }

            .logo svg {
                width: 36px;
                height: 36px;
            }

            .proxy-card {
                padding: 15px;
            }

            .connect-btn {
                padding: 12px 15px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
            </div>
            <h1>Proxy для Telegram</h1>
            <p class="subtitle">Выберите сервер для подключения</p>
        </div>

        <div class="proxy-list">
            <div class="proxy-card socks">
                <div class="proxy-header">
                    <div class="proxy-type">
                        <span class="type-badge socks">SOCKS5</span>
                        <div class="status-dot"></div>
                    </div>
                </div>
                <p class="proxy-server">10.11.55.109:2080</p>
                <a href="tg://socks?server=10.11.55.109&port=2080" class="connect-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                    Подключиться
                </a>
            </div>

            <div class="proxy-card mtproto">
                <div class="proxy-header">
                    <div class="proxy-type">
                        <span class="type-badge mtproto">MTProto</span>
                        <div class="status-dot"></div>
                    </div>
                </div>
                <p class="proxy-server">147.45.69.142:1050</p>
                <a href="tg://proxy?server=147.45.69.142&port=1050" class="connect-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                    Подключиться
                </a>
            </div>

            <div class="proxy-card mtproto">
                <div class="proxy-header">
                    <div class="proxy-type">
                        <span class="type-badge mtproto">MTProto</span>
                        <div class="status-dot"></div>
                    </div>
                </div>
                <p class="proxy-server">138.124.52.12:443</p>
                <a href="tg://proxy?server=138.124.52.12&port=443&secret=eeba999c3d340f11bc5cbb6ed5d958aee974672e6e6b2d616761742e7275" class="connect-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                    Подключиться
                </a>
            </div>
        </div>

        <div class="footer">
            <p>Быстрое и безопасное подключение</p>
        </div>
    </div>

    <div class="toast" id="toast">Скопировано!</div>

    <script>
        document.querySelectorAll('.proxy-card').forEach(card => {
            card.addEventListener('click', function(e) {
                if (!e.target.closest('.connect-btn')) {
                    const btn = this.querySelector('.connect-btn');
                    if (btn) {
                        const href = btn.getAttribute('href');
                        const server = href.match(/server=([^&]+)/)?.[1];
                        if (server) {
                            navigator.clipboard.writeText(server).then(() => {
                                showToast('Адрес скопирован!');
                            });
                        }
                    }
                }
            });
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
